spring.application.name=gazibnb-clone

# ===========================
# DATABASE CONFIG
# ===========================
spring.datasource.url=jdbc:postgresql://localhost:5432/airbnb
spring.datasource.username=postgres
spring.datasource.password=\u015Fans


# Hibernate Dialect — Spring Boot 3 + Hibernate 6 için zorunlu
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JDBC platform
spring.sql.init.platform=postgres

# ===========================
# JPA CONFIG
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ===========================
# MULTIPART FILE UPLOAD
# ===========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===========================
# FILE UPLOAD DIRECTORY
# ===========================
app.upload.dir=/home/shadowfax/Documents/airbnb-clone/airbnb-clone/public
server.port=8085

